# Boltz configuration
seed: 68
recycling_steps: 3
diffusion_samples: 1
sampling_steps: 100
sampling_steps_affinity: 100
diffusion_samples_affinity: 3
# Recycling steps for the affinity model (default 5).  Reducing to 2 for §NN
# fast pre-screening passes is handled automatically in wrapper.py (§III).
recycling_steps_affinity: 5
affinity_mw_correction: true
output_format: "pdb"
override: false
no_kernels: true
remove_files: true # Remove files after processing

batch_predictions: false

# Inference-time potentials (FK steering + physical guidance).
# When true, steers diffusion toward physically plausible poses — can improve
# affinity accuracy on hardware with ample GPU memory (A100 / H100).
# Adds ~10-20% to per-molecule inference time.  Default: false.
use_potentials: false

# Diffusion temperature scale (library default: 1.5).
# Lower values (<1.5) reduce pose diversity but increase consistency.
# Higher values (>1.5) increase diversity at the cost of more noise.
# Set to null to use the library default.
step_scale: null

# MSA subsampling — controls how many sequences from the pre-computed .a3m file
# are passed to the Boltz-2 model.  More sequences = richer evolutionary context
# = better affinity predictions, at the cost of larger attention tensors and
# slower inference.
#
# Library defaults: subsample_msa=true, num_subsampled_msa=1024, max_msa_seqs=8192
#
# Recommended tuning:
#   RTX 3090 / RTX 4090 : keep num_subsampled_msa=1024 (memory-constrained)
#   A100 80 GB           : try num_subsampled_msa=2048 for ~5-10% better affinity
#   H100                 : try num_subsampled_msa=4096
#
# Set subsample_msa: false to use the full MSA (rarely beneficial — most MSAs
# contain thousands of sequences that overwhelm GPU memory).
subsample_msa: true
num_subsampled_msa: 1024

# Parallel diffusion samples for affinity prediction.
# When diffusion_samples_affinity > 1, controls how many samples run simultaneously.
# max_parallel_samples=1 (default): serial, lowest memory.
# max_parallel_samples=3: all samples in one batch — ~2-3x faster on H100 80 GB;
#   set automatically via §LLLLLL hardware-adaptive logic in wrapper.py on ≥70 GiB GPUs.
# Note: structure prediction always uses 1 sample (diffusion_samples=1), so this
# parameter only matters for the affinity model.
max_parallel_samples: 1

# I/O parallelism for data loading and preprocessing.
# Increase on machines with many CPU cores and fast NVMe storage.
# Reduce to 1/1 if PSICHIC and Boltz share CPU workers and cause contention.
num_workers: 2
preprocessing_threads: 4

